name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wareflow-gui-windows
          path: ./artifacts

      - name: Display artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -lh artifacts/

      - name: Verify artifacts
        run: |
          if [ ! -f "artifacts/Warehouse-GUI.exe" ]; then
            echo "ERROR: Warehouse-GUI.exe not found!"
            exit 1
          fi
          if [ ! -f "artifacts/Warehouse-GUI.exe.sha256" ]; then
            echo "ERROR: Checksum file not found!"
            exit 1
          fi
          echo "All artifacts verified successfully"

      - name: Prepare release notes
        id: release_notes
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          cat > release_notes.md << EOF
          # Wareflow Analysis v${VERSION}

          ## 🚀 Windows Executable

          This release includes a standalone Windows executable that requires no Python installation.

          ### 📥 Download

          - **Warehouse-GUI.exe** - The main application executable
          - **Warehouse-GUI.exe.sha256** - SHA256 checksum for verification

          ### ✨ Features

          - 🏠 **Dashboard**: Project status and quick actions
          - 📥 **Data Import**: Excel file import with Auto-Pilot
          - 📊 **Analysis**: ABC classification and inventory analysis
          - 📤 **Export**: Generate Excel reports
          - 📈 **Status**: Database and project information

          ### 🔐 Verification

          To verify the download integrity:

          \`\`\`bash
          # On Windows (PowerShell)
          Get-FileHash Warehouse-GUI.exe -Algorithm SHA256

          # On Linux/macOS
          sha256sum -c Warehouse-GUI.exe.sha256
          \`\`\`

          ### 📋 System Requirements

          - Windows 10 or later
          - 100 MB free disk space
          - No Python installation required

          ### 🐛 Bug Fixes

          See the [commit history](https://github.com/wareflowx/wareflow-analysis/commits/v${VERSION}) for details.

          ### 📚 Documentation

          - [User Guide](https://github.com/wareflowx/wareflow-analysis/blob/main/README.md)
          - [Issue Tracker](https://github.com/wareflowx/wareflow-analysis/issues)

          ---

          **Full Changelog**: https://github.com/wareflowx/wareflow-analysis/compare/${{ github.event.release.target_commitish || 'previous' }}...v${VERSION}
          EOF
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/Warehouse-GUI.exe
            artifacts/Warehouse-GUI.exe.sha256
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release summary
        run: |
          echo "## 🎉 Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Available Downloads" >> $GITHUB_STEP_SUMMARY
          echo "- Warehouse-GUI.exe" >> $GITHUB_STEP_SUMMARY
          echo "- Warehouse-GUI.exe.sha256" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- Tag: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
